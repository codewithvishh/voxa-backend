# ==============================================================================
# VOXA MUSIC STREAMING PLATFORM - PRODUCTION PROFILE (application-prod.properties)
# Active when SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:musicapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Disable in-memory consoles
spring.h2.console.enabled=false
