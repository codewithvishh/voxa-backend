# ==============================================================================
# VOXA MUSIC STREAMING PLATFORM - APPLICATION CONFIGURATION
# All values use ${ENV_VAR:default} to allow complete override via .env / OS env
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION & SERVER SETTINGS
# ------------------------------------------------------------------------------
spring.application.name=music-streaming-backend
server.port=${PORT:8080}
server.servlet.context-path=/

# ------------------------------------------------------------------------------
# 2. DATABASE CONFIGURATION (PostgreSQL / Neon)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:musicapp}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# 3. JPA / HIBERNATE ORM SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# 4. JWT SECURITY & TOKEN SETTINGS
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:9a3f91b7d5e4c2a180f63b4d2e7a1c9f8e5b2a4d7c1e9f3b5a8c2d4e6f1a7b9c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ------------------------------------------------------------------------------
# 5. CORS ALLOWED ORIGINS (Frontend Web Clients)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost:3000,http://127.0.0.1:5173,http://localhost:8080}

# ------------------------------------------------------------------------------
# 6. EXTERNAL MUSIC APIS (Jamendo Music API)
# ------------------------------------------------------------------------------
app.jamendo.client-id=${JAMENDO_CLIENT_ID:ed124ea3}
app.jamendo.api-url=${JAMENDO_API_URL:https://api.jamendo.com/v3.0}

# ------------------------------------------------------------------------------
# 7. EMAIL SERVICE (Spring Mail / SMTP OTP Verification)
# ------------------------------------------------------------------------------
# Resend REST API (HTTPS port 443 - works on Render without SMTP port blocking)
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:Voxa <onboarding@resend.dev>}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:voxamusic4@gmail.com}
spring.mail.password=${MAIL_PASSWORD:flekueiwyhfqisbt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------------------------
# 8. DEFAULT SEED ACCOUNTS
# ------------------------------------------------------------------------------
app.seed.admin.email=${ADMIN_EMAIL:admin@musicapp.com}
app.seed.admin.password=${ADMIN_PASSWORD:admin123}
app.seed.demo.email=${DEMO_USER_EMAIL:user@musicapp.com}
app.seed.demo.password=${DEMO_USER_PASSWORD:user123}

# ------------------------------------------------------------------------------
# 9. ACTUATOR & HEALTH MONITORING
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ------------------------------------------------------------------------------
# 10. SWAGGER / OPENAPI DOCUMENTATION
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
